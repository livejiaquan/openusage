name: Build SSH remote usage app

on:
  workflow_dispatch:
  push:
    branches: [feat/ssh-remote-usage]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check remote exporter
        run: python3 -m unittest discover -s Tests -p remote_usage_export_tests.py -v

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./script/build_and_run.sh build

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/OpenUsage.app OpenUsage-ssh-remote.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenUsage-ssh-remote
          path: OpenUsage-ssh-remote.zip
          if-no-files-found: error
